<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Train with Masi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#F2F4F6;--ink:#152238;--muted:#5B6678;--accent:#0F766E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1621;--ink:#EEF2F7;--muted:#9AA6B8;--accent:#2DD4BF;color-scheme:dark}}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
main{text-align:center;max-width:420px}
h1{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-size:48px;font-weight:700;margin:0 0 8px;line-height:1}
p{color:var(--muted);margin:0;font-size:16px}
</style>
</head>
<body>
<main>
  <h1>Train with Masi</h1>
  <p>Personal training. Your workout link was sent to you directly.</p>
</main>
</body>
</html>
